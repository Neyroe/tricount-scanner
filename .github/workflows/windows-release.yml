name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: >
          pyinstaller --noconfirm --onefile --name TricountScanner
          --add-data "frontend;frontend"
          --add-data ".env.example;."
          --collect-all tricount
          --collect-submodules uvicorn
          --collect-submodules pdfplumber
          --hidden-import main
          launch.py

      - name: Vérifier que l'exécutable démarre
        shell: pwsh
        run: |
          # Au tout premier lancement l'appli crée un .env puis s'arrête, le temps
          # que l'utilisateur y colle son lien : on le fournit donc d'avance.
          Set-Content -Path dist\.env -Value "tricount_url=" -Encoding utf8
          $env:NO_BROWSER = "1"
          $p = Start-Process -FilePath dist\TricountScanner.exe -PassThru `
               -RedirectStandardOutput dist\out.log -RedirectStandardError dist\err.log
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "--- sortie standard ---"; Get-Content dist\out.log -ErrorAction SilentlyContinue
            Write-Host "--- erreurs ---";        Get-Content dist\err.log -ErrorAction SilentlyContinue
            throw "L'exécutable n'a pas servi l'interface."
          }
          Write-Host "L'interface répond (HTTP 200)."
          Remove-Item dist\.env, dist\out.log, dist\err.log, dist\credentials.json -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: TricountScanner-windows
          path: dist/TricountScanner.exe

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TricountScanner.exe
          generate_release_notes: true
